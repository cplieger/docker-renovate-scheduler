# promtool test rules alerts/promql_test.yaml
rule_files:
  - promql.yaml

evaluation_interval: 1m

tests:
  - name: a failing scrape pages after 5m and keeps the target's labels
    interval: 1m
    input_series:
      - series: 'up{job="renovate", instance="renovate:9470"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: RenovateDown
        exp_alerts: []
      - eval_time: 8m
        alertname: RenovateDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
              instance: renovate:9470
            exp_annotations:
              summary: "docker-renovate-scheduler is not being scraped"
              description: "No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, or the scrape cannot reach METRICS_LISTEN_ADDR. Check the container's state and its `daemon stopped` line.\n"

  - name: a target that is gone pages through the absent arm
    interval: 1m
    input_series:
      - series: 'up{job="other", instance="x:1"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: RenovateDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
            exp_annotations:
              summary: "docker-renovate-scheduler is not being scraped"
              description: "No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, or the scrape cannot reach METRICS_LISTEN_ADDR. Check the container's state and its `daemon stopped` line.\n"

  - name: RenovateRunFailed holds per scope while its last run failed and clears at its next good run
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_last_run_ok{job="renovate", instance="renovate:9470", scope="full"}'
        values: "1 0x4 1x4"
      - series: 'renovate_scheduler_last_run_ok{job="renovate", instance="renovate:9470", scope="scoped"}'
        values: "1x9"
    alert_rule_test:
      - eval_time: 0m
        alertname: RenovateRunFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: RenovateRunFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
              instance: renovate:9470
              scope: full
            exp_annotations:
              summary: "The last full Renovate run failed"
              description: "The latest completed run of this scope failed. renovate_scheduler_last_run_result names the cause, and the container log has the detail. Check RENOVATE_TOKEN or the GitHub App settings, whether the platform is reachable, and the memory limit.\n"
      - eval_time: 7m
        alertname: RenovateRunFailed
        exp_alerts: []

  - name: a fresh install with no completed run has no failed run
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_info{job="renovate", instance="renovate:9470", mode="built-in", auth="token"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: RenovateRunFailed
        exp_alerts: []

  - name: with the deadline at 0, RenovateNoRecentRun fires 14h after the last complete full run, after its 30m for, whatever scoped runs do, and clears at the next one
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_last_success_timestamp_seconds{job="renovate", instance="renovate:9470", scope="full"}'
        values: "60x899 54000x100"
      - series: 'renovate_scheduler_last_success_timestamp_seconds{job="renovate", instance="renovate:9470", scope="scoped"}'
        values: "60+60x1000"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
    alert_rule_test:
      - eval_time: 14h20m
        alertname: RenovateNoRecentRun
        exp_alerts: []
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
              instance: renovate:9470
              scope: full
            exp_annotations:
              summary: "No full Renovate run has completed on schedule"
              description: "No complete full run by the run deadline, or in 14h while it reads 0 (RUN_INTERVAL=off). Runs may be failing or tolerated, or a scheduler stopped; scoped runs do not count. Check renovate_scheduler_last_run_result and the container log.\n"
      - eval_time: 15h5m
        alertname: RenovateNoRecentRun
        exp_alerts: []

  - name: with the deadline at 0, RenovateNoRecentRun measures from the process start when no complete full run is on record
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v4.0.0"}'
        values: "1x1000"
    alert_rule_test:
      - eval_time: 14h20m
        alertname: RenovateNoRecentRun
        exp_alerts: []
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
              instance: renovate:9470
            exp_annotations:
              summary: "No full Renovate run has completed on schedule"
              description: "No complete full run by the run deadline, or in 14h while it reads 0 (RUN_INTERVAL=off). Runs may be failing or tolerated, or a scheduler stopped; scoped runs do not count. Check renovate_scheduler_last_run_result and the container log.\n"

  - name: the process-start arm follows the app under any scrape job name
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate-scheduler", instance="scheduler:9470"}'
        values: "0x1000"
      - series: 'process_start_time_seconds{job="renovate-scheduler", instance="scheduler:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate-scheduler", instance="scheduler:9470", version="v4.0.0"}'
        values: "1x1000"
    alert_rule_test:
      - eval_time: 14h20m
        alertname: RenovateNoRecentRun
        exp_alerts: []
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate-scheduler
              instance: scheduler:9470
            exp_annotations:
              summary: "No full Renovate run has completed on schedule"
              description: "No complete full run by the run deadline, or in 14h while it reads 0 (RUN_INTERVAL=off). Runs may be failing or tolerated, or a scheduler stopped; scoped runs do not count. Check renovate_scheduler_last_run_result and the container log.\n"

  - name: another job's process start beside a waiting renovate target raises the alert for the renovate target only
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'process_start_time_seconds{job="node", instance="node:9100"}'
        values: "0x1000"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v4.0.0"}'
        values: "1x1000"
    alert_rule_test:
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
              instance: renovate:9470
            exp_annotations:
              summary: "No full Renovate run has completed on schedule"
              description: "No complete full run by the run deadline, or in 14h while it reads 0 (RUN_INTERVAL=off). Runs may be failing or tolerated, or a scheduler stopped; scoped runs do not count. Check renovate_scheduler_last_run_result and the container log.\n"

  - name: another job's process start never raises RenovateNoRecentRun
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="node", instance="node:9100"}'
        values: "0x1000"
    alert_rule_test:
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts: []

  - name: another job's process start beside a healthy renovate target never raises RenovateNoRecentRun
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'process_start_time_seconds{job="node", instance="node:9100"}'
        values: "0x1000"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v4.0.0"}'
        values: "1x1000"
      - series: 'renovate_scheduler_last_success_timestamp_seconds{job="renovate", instance="renovate:9470", scope="full"}'
        values: "1+60x1000"
    alert_rule_test:
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts: []

  - name: with the deadline at 0, a complete full run every 6h, the default interval, never alerts
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1439"
      - series: 'renovate_scheduler_last_success_timestamp_seconds{job="renovate", instance="renovate:9470", scope="full"}'
        values: "1x359 21601x359 43201x359 64801x359"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1439"
    alert_rule_test:
      - eval_time: 15h
        alertname: RenovateNoRecentRun
        exp_alerts: []
      - eval_time: 23h
        alertname: RenovateNoRecentRun
        exp_alerts: []

  - name: the deadline arm fires 15m past the deadline, after its 30m for, and resolves when a complete full run moves it
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "3600x119 100000x880"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v4.0.0"}'
        values: "1x1000"
    alert_rule_test:
      - eval_time: 1h44m
        alertname: RenovateNoRecentRun
        exp_alerts: []
      - eval_time: 1h46m
        alertname: RenovateNoRecentRun
        exp_alerts:
          - exp_labels:
              severity: warning
              job: renovate
              instance: renovate:9470
            exp_annotations:
              summary: "No full Renovate run has completed on schedule"
              description: "No complete full run by the run deadline, or in 14h while it reads 0 (RUN_INTERVAL=off). Runs may be failing or tolerated, or a scheduler stopped; scoped runs do not count. Check renovate_scheduler_last_run_result and the container log.\n"
      - eval_time: 2h1m
        alertname: RenovateNoRecentRun
        exp_alerts: []

  - name: a deadline still ahead keeps RenovateNoRecentRun quiet past the 14h window
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "200000x1000"
      - series: 'renovate_scheduler_last_success_timestamp_seconds{job="renovate", instance="renovate:9470", scope="full"}'
        values: "60x1000"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v4.0.0"}'
        values: "1x1000"
    alert_rule_test:
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts: []

  - name: a deadline of 0 never fires the deadline arm
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_run_deadline_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_last_success_timestamp_seconds{job="renovate", instance="renovate:9470", scope="full"}'
        values: "1+60x1000"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x1000"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v4.0.0"}'
        values: "1x1000"
    alert_rule_test:
      - eval_time: 1h
        alertname: RenovateNoRecentRun
        exp_alerts: []
      - eval_time: 14h35m
        alertname: RenovateNoRecentRun
        exp_alerts: []

  # The dashboard's Runs by result query, with $instance and its 5m slot filled in.
  # TestDashboardRunsByResultIsTheTestedQuery fails when the two differ.
  - name: "Runs by result: a slot counts the runs that ended in it"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "0+1x30"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x30"
    promql_expr_test:
      - expr: &runs_by_result 'label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(round(sum by (scope, result) (((renovate_scheduler_runs_total{instance="renovate:9470"} - renovate_scheduler_runs_total{instance="renovate:9470"} offset 5m) unless on (instance) ((process_start_time_seconds{instance="renovate:9470"} != process_start_time_seconds{instance="renovate:9470"} offset 5m) or (process_start_time_seconds{instance="renovate:9470"} > time() - 300000 / 1000))) or (renovate_scheduler_runs_total{instance="renovate:9470"} and on (instance) ((process_start_time_seconds{instance="renovate:9470"} != process_start_time_seconds{instance="renovate:9470"} offset 5m) or (process_start_time_seconds{instance="renovate:9470"} > time() - 300000 / 1000))) or (renovate_scheduler_runs_total{instance="renovate:9470"} - min_over_time(renovate_scheduler_runs_total{instance="renovate:9470"}[5m])))) > 0, "scope", "Full", "scope", "full"), "scope", "Scoped", "scope", "scoped"), "result", "Complete", "result", "complete"), "result", "Failed", "result", "failed"), "result", "Aborted", "result", "aborted"), "result", "Timed out", "result", "timed_out"), "result", "Did not start", "result", "start_failed"), "result", "Repository error", "result", "repository_error"), "result", "Token unavailable", "result", "token_unavailable"), "result", "Token request failed", "result", "token_failed"), "result", "Base folder check failed", "result", "preflight_failed"), "result", "Process left running", "result", "contained")'
        eval_time: 20m
        exp_samples:
          - labels: '{result="Failed", scope="Full"}'
            value: 5
  - name: "Runs by result: a slot with no run draws no bar"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "5x40"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x40"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 30m
        exp_samples: []
  - name: "Runs by result: a restart counts the startup run even when its total matches the old one"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "1x29 1x20"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 34m
        exp_samples:
          - labels: '{result="Failed", scope="Full"}'
            value: 1
  - name: "Runs by result: a failed scrape during the restart does not hide it"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "1x28 stale 1x20"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x28 stale 1770x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 34m
        exp_samples:
          - labels: '{result="Failed", scope="Full"}'
            value: 1
  - name: "Runs by result: a restart counts the new total, not the drop from the old one"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "3x29 0 2 3 4x20"
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="complete"}'
        values: "5x29 0x20"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 34m
        exp_samples:
          - labels: '{result="Failed", scope="Full"}'
            value: 4
  - name: "Runs by result: the slot after a restart draws no bar"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "1x29 1x20"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 39m
        exp_samples: []
  - name: "Runs by result: a start just before a slot ends counts in the slot of its first scrape"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "3x29 _ 1x20"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x29 _ 1794x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 35m
        exp_samples:
          - labels: '{result="Failed", scope="Full"}'
            value: 1
  - name: "Runs by result: a first scrape counts the growth inside the slot, not the lifetime total"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_runs_total{job="renovate", instance="renovate:9470", scope="full", result="failed"}'
        values: "_x29 7 7 8x10"
      - series: 'process_start_time_seconds{job="renovate", instance="renovate:9470"}'
        values: "_x29 0x12"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 34m
        exp_samples:
          - labels: '{result="Failed", scope="Full"}'
            value: 1

  # The dashboard's Next full run tile, with $instance filled in.
  # TestDashboardQueriesAreTheTestedOnes fails when the two differ.
  - name: "Next full run tile: the scheduled start in milliseconds, on the picked instance only"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_next_run_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "1794720600x10"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v1.0.0"}'
        values: "1x10"
      - series: 'renovate_scheduler_next_run_timestamp_seconds{job="renovate", instance="other:9470"}'
        values: "1794000000x10"
    promql_expr_test:
      - expr: &next_run_tile '((renovate_scheduler_next_run_timestamp_seconds{instance="renovate:9470"} > 0) * 1000) or on (instance) (0 * max by (instance) (renovate_scheduler_build_info{instance="renovate:9470"}))'
        eval_time: 5m
        exp_samples:
          - labels: '{instance="renovate:9470", job="renovate"}'
            value: 1794720600000
  - name: "Next full run tile: RUN_INTERVAL=off serves 0, which reads No schedule"
    interval: 1m
    input_series:
      - series: 'renovate_scheduler_next_run_timestamp_seconds{job="renovate", instance="renovate:9470"}'
        values: "0x10"
      - series: 'renovate_scheduler_build_info{job="renovate", instance="renovate:9470", version="v1.0.0"}'
        values: "1x10"
    promql_expr_test:
      - expr: *next_run_tile
        eval_time: 5m
        exp_samples:
          - labels: '{instance="renovate:9470"}'
            value: 0
  - name: "Next full run tile: an unscraped scheduler answers nothing, which reads Not scraped"
    interval: 1m
    input_series:
      - series: 'up{job="renovate", instance="renovate:9470"}'
        values: "0x10"
    promql_expr_test:
      - expr: *next_run_tile
        eval_time: 5m
        exp_samples: []
