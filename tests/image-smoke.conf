# Per-app config for the shared image-smoke harness (tests/image-smoke.sh).
# Boots the image in external-trigger mode, then smoke_verify runs Renovate
# offline (`local` platform, dryRun=extract, --network none) against a
# generated one-file repository and ends with a negative control that proves
# a Renovate crashing at bootstrap is reported as a failed run. That control is
# what holds the pinned base to exiting non-zero on a rejected bootstrap import
# (renovatebot/renovate#45895); a base that regressed it would report the crash
# as a completed run and the control goes red.
#
# Between the two, Renovate runs against tests/forge-stub.mjs, a stand-in
# Forgejo on the container's loopback that wants the token on every request,
# and plain git then clones and pushes with the credential URL forms Renovate
# builds. Those cover the path the `local` platform skips: Renovate's clone URL,
# git and libcurl together. A libcurl update that made git drop token-only URL
# credentials broke every PAT and Forgejo user of 3.6.2 while the offline run
# above stayed green (#1336).
#
# Constraints that shape the knobs below:
# - The `local` platform treats the process working directory as the single
#   repository and rejects RENOVATE_REPOSITORIES, so the container starts with
#   -w at the fixture mount and that variable stays unset.
# - The fixture is generated per run rather than committed under tests/: a
#   committed Dockerfile would be picked up by Renovate itself and by the
#   Dockerfile lint gates.
# - The negative control leaves the container broken, so it runs last.
# The harness reads this as the image name, so it must be the published image's
# name: the license-tree check asserts /usr/share/licenses/$SMOKE_APP_NAME/LICENSE.
SMOKE_APP_NAME=docker-renovate-scheduler
# External mode boots healthy at once, so the first probe succeeds inside the
# baked start period; 150s is margin for the image to boot and reach that probe.
SMOKE_TIMEOUT=150

# One Dockerfile is the smallest repository Renovate extracts something from.
SMOKE_FIXTURE=$(mktemp -d)
# Release what the line above acquired: the harness's EXIT trap calls this after
# removing the container, and the fixture failure path below calls it directly
# (the trap is armed only after this file is sourced).
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}
# mktemp creates the directory 0700 for the runner's user; the container runs as
# a different non-root uid, so the directory must be traversable and the file
# readable for that uid.
if ! printf 'FROM alpine:3.20\n' >"$SMOKE_FIXTURE/Dockerfile" \
  || ! chmod 755 "$SMOKE_FIXTURE" \
  || ! chmod 644 "$SMOKE_FIXTURE/Dockerfile"; then
  printf 'FAIL: could not write the smoke repository fixture\n' >&2
  smoke_cleanup
  exit 1
fi

# Word-split by the harness; neither a mktemp path nor a checkout's tests
# directory contains spaces. RUN_TIMEOUT bounds each `run` below, which
# otherwise waits on the daemon's 1h default.
SMOKE_RUN_ARGS="--network none -w /smoke-repo -v ${SMOKE_FIXTURE}:/smoke-repo:ro -v ${SMOKE_DIR}:/smoke-tests:ro -e RUN_INTERVAL=off -e RUN_TIMEOUT=5m -e RENOVATE_PLATFORM=local -e RENOVATE_DRY_RUN=extract"
SMOKE_LICENSE_TREE=1

# The stand-in forge. The token is a fixture value, not a credential.
SMOKE_FORGE_PORT=18080
SMOKE_FORGE_TOKEN=smoke-forge-token
SMOKE_FORGE_DIR=/tmp/smoke-forge

# Poll the container log for a fixed string. The json-file log driver can lag
# the writer, so a single grep can miss a line the container already wrote.
smoke_wait_for_log() {
  i=0
  while [ "$i" -lt 30 ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- "$1"; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$2" >&2
  return 1
}

# Count the stand-in forge's answers: `served` or `refused`, then a route such
# as `git git-upload-pack`. 0 before the stub has answered anything.
smoke_forge_count() {
  docker exec "$SMOKE_CONTAINER" node -e '
    const fs = require("fs");
    const s = fs.existsSync(process.argv[1]) ? JSON.parse(fs.readFileSync(process.argv[1], "utf8")) : {};
    console.log(s[process.argv[2]]?.[process.argv[3]] ?? 0);
  ' "$SMOKE_FORGE_DIR/stats.json" "$1" "$2"
}

smoke_forge_report() {
  printf '%s\n' '--- stand-in forge: requests ---' >&2
  docker exec "$SMOKE_CONTAINER" cat "$SMOKE_FORGE_DIR/stats.json" >&2 || true
  printf '\n%s\n' '--- stand-in forge: log ---' >&2
  docker exec "$SMOKE_CONTAINER" cat "$SMOKE_FORGE_DIR/stub.log" >&2 || true
}

smoke_forge() {
  if ! docker exec "$SMOKE_CONTAINER" sh -eu -c '
    mkdir -p "$1/git/smoke" "$1/seed"
    git init -q --bare -b main "$1/git/smoke/repo.git"
    git init -q -b main "$1/seed"
    printf "FROM alpine:3.20\n" >"$1/seed/Dockerfile"
    git -C "$1/seed" add Dockerfile
    git -C "$1/seed" -c user.name=smoke -c user.email=smoke@example.com commit -q -m seed
    git -C "$1/seed" push -q "$1/git/smoke/repo.git" main
  ' sh "$SMOKE_FORGE_DIR"; then
    printf 'FAIL: could not seed the stand-in forge repository\n' >&2
    return 1
  fi
  if ! docker exec -d "$SMOKE_CONTAINER" sh -c 'exec node /smoke-tests/forge-stub.mjs "$@" 2>"$4/stub.log"' \
    sh "$SMOKE_FORGE_PORT" "$SMOKE_FORGE_TOKEN" "$SMOKE_FORGE_DIR/git" "$SMOKE_FORGE_DIR"; then
    printf 'FAIL: could not start the stand-in forge\n' >&2
    return 1
  fi
  i=0
  until docker exec "$SMOKE_CONTAINER" test -f "$SMOKE_FORGE_DIR/ready"; do
    i=$((i + 1))
    if [ "$i" -ge 30 ]; then
      printf 'FAIL: the stand-in forge did not start within 30s\n' >&2
      smoke_forge_report
      return 1
    fi
    sleep 1
  done

  finished=$(docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF 'Repository finished' || true)
  complete=$(docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF 'renovate run complete' || true)
  # exitCodeForErrors turns a repository that could not be cloned (Renovate's
  # external-host-error) into exit 7. The scheduler tolerates that for 2h and
  # still exits 0, so only its own log line below tells a clean run from one.
  if ! out=$(docker exec \
    -e RENOVATE_PLATFORM=forgejo \
    -e "RENOVATE_ENDPOINT=http://127.0.0.1:$SMOKE_FORGE_PORT/api/v1/" \
    -e "RENOVATE_TOKEN=$SMOKE_FORGE_TOKEN" \
    -e RENOVATE_ONBOARDING=false \
    -e RENOVATE_REQUIRE_CONFIG=optional \
    -e RENOVATE_EXIT_CODE_FOR_ERRORS=true \
    "$SMOKE_CONTAINER" docker-renovate-scheduler run smoke/repo 2>&1); then
    printf 'FAIL: Renovate did not finish the stand-in forge repository; its log above names the result\n' >&2
    printf '%s\n' "$out" >&2
    smoke_forge_report
    return 1
  fi
  SMOKE_FINISHED=$((finished + 1))
  i=0
  until [ "$(docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF 'Repository finished' || true)" -ge "$SMOKE_FINISHED" ]; do
    i=$((i + 1))
    if [ "$i" -ge 30 ]; then
      printf "FAIL: the forge run exited 0 but Renovate never logged 'Repository finished' for it\n" >&2
      return 1
    fi
    sleep 1
  done
  i=0
  until [ "$(docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF 'renovate run complete' || true)" -gt "$complete" ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF 'renovate run ended in a repository error'; then
      printf 'FAIL: Renovate ended the stand-in forge repository in an error state; its log above names the result\n' >&2
      smoke_forge_report
      return 1
    fi
    i=$((i + 1))
    if [ "$i" -ge 30 ]; then
      printf "FAIL: the forge run exited 0 but the scheduler never logged 'renovate run complete' for it\n" >&2
      return 1
    fi
    sleep 1
  done
  # Negated, so a count that is not a number fails as well.
  if ! [ "$(smoke_forge_count served 'git git-upload-pack')" -ge 1 ]; then
    printf 'FAIL: the forge run exited 0 without one authenticated git fetch from the stand-in forge\n' >&2
    smoke_forge_report
    return 1
  fi

  # Renovate pushes its branches with the same URL. GitHub's form, then Forgejo's.
  if ! out=$(docker exec -e GIT_TERMINAL_PROMPT=0 "$SMOKE_CONTAINER" sh -eu -c '
    n=0
    for cred in "x-access-token:$2" "$2:x-oauth-basic"; do
      n=$((n + 1))
      git clone -q "http://$cred@127.0.0.1:$1/smoke/repo.git" "$3/probe-$n"
      git -C "$3/probe-$n" -c user.name=smoke -c user.email=smoke@example.com commit -q --allow-empty -m probe
      git -C "$3/probe-$n" push -q origin "HEAD:refs/heads/probe-$n"
    done
  ' sh "$SMOKE_FORGE_PORT" "$SMOKE_FORGE_TOKEN" "$SMOKE_FORGE_DIR" 2>&1); then
    printf 'FAIL: git could not clone and push with credentials in the URL\n' >&2
    printf '%s\n' "$out" >&2
    smoke_forge_report
    return 1
  fi
  if ! [ "$(smoke_forge_count served 'git git-receive-pack')" -ge 2 ]; then
    printf 'FAIL: the push probe exited 0 without two authenticated pushes to the stand-in forge\n' >&2
    smoke_forge_report
    return 1
  fi
  SMOKE_FORGE_FETCHES=$(smoke_forge_count served 'git git-upload-pack')
  SMOKE_FORGE_UNKNOWN=$(docker exec "$SMOKE_CONTAINER" node -e '
    const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
    console.log([...new Set(s.unknown)].join(", ") || "none");
  ' "$SMOKE_FORGE_DIR/stats.json")
}

smoke_verify() {
  if ! out=$(docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler run 2>&1); then
    printf 'FAIL: the offline extraction run against the fixture repository did not exit 0\n' >&2
    printf '%s\n' "$out" >&2
    return 1
  fi
  smoke_wait_for_log 'Repository finished' \
    "the run exited 0 but Renovate never logged 'Repository finished': the process did not reach the repository worker"
  # A directory with no visible package files is a soft skip (exit 0 and
  # 'Repository finished' still logged); this line only follows an extraction.
  smoke_wait_for_log 'Extracted dependencies' \
    "the run exited 0 but Renovate never logged 'Extracted dependencies': it did not see the fixture Dockerfile"
  if ! docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler health; then
    printf 'FAIL: health did not pass after a completed run\n' >&2
    return 1
  fi

  # Called bare so the hook's errexit still holds inside it.
  smoke_forge

  # Negative control. Hiding the global worker module makes Renovate's
  # bootstrap import reject, the same shape as a base image shipping a broken
  # module graph.
  if ! docker exec -u root "$SMOKE_CONTAINER" \
    mv /usr/local/renovate/dist/workers/global /tmp/smoke-hidden-workers-global; then
    printf 'FAIL: could not hide /usr/local/renovate/dist/workers/global; the control premise moved and the path needs re-pointing\n' >&2
    return 1
  fi
  if docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler run >/dev/null 2>&1; then
    printf 'FAIL: a crashed Renovate was reported as a completed run\n' >&2
    return 1
  fi
  smoke_wait_for_log 'renovate run failed' \
    "the crashed run exited non-zero but the scheduler never logged 'renovate run failed'"
  # Single shot, not polled: the wait above proved the log is flushed past the
  # crashed run's end, so one more 'Repository finished' would mean that run
  # reached its repository and failed for some other reason than the hidden module.
  if [ "$(docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF 'Repository finished')" != "$SMOKE_FINISHED" ]; then
    printf 'FAIL: the crashed run reached the repository worker; it did not die at bootstrap\n' >&2
    return 1
  fi
  if docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler health >/dev/null 2>&1; then
    printf 'FAIL: health still passes after a crashed run\n' >&2
    return 1
  fi

  # Every assertion above is silent on success, so name what was proved: a run
  # that drove Renovate and one whose hook returned early otherwise print the
  # same thing, leaving the harness's elapsed time unaccountable.
  printf 'renovate-scheduler payload: an offline run extracted the fixture Dockerfile and finished the repository with health passing; a forgejo run cloned the stand-in forge with a token (%s authenticated fetches, unknown routes: %s) and git pushed with both credential URL forms; and with the global worker module hidden the run died at bootstrap without reaching the repository, was reported failed, and flipped health\n' \
    "$SMOKE_FORGE_FETCHES" "$SMOKE_FORGE_UNKNOWN"
}
