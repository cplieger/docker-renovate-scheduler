# Per-app config for the shared image-smoke harness (tests/image-smoke.sh).
# Boots the image in external-trigger mode, then smoke_verify runs Renovate
# offline (`local` platform, dryRun=extract, --network none) against a
# generated one-file repository and ends with a negative control that proves
# a Renovate crashing at bootstrap is reported as a failed run. That control is
# what holds the pinned base to exiting non-zero on a rejected bootstrap import
# (renovatebot/renovate#45895); a base that regressed it would report the crash
# as a completed run and the control goes red.
#
# Constraints that shape the knobs below:
# - The `local` platform treats the process working directory as the single
#   repository and rejects RENOVATE_REPOSITORIES, so the container starts with
#   -w at the fixture mount and that variable stays unset.
# - The fixture is generated per run rather than committed under tests/: a
#   committed Dockerfile would be picked up by Renovate itself and by the
#   Dockerfile lint gates.
# - The negative control leaves the container broken, so it runs last.
SMOKE_APP_NAME=renovate-scheduler
# External mode boots healthy at once, so the first probe succeeds inside the
# baked start period; 150s is margin for the image to boot and reach that probe.
SMOKE_TIMEOUT=150

# One Dockerfile is the smallest repository Renovate extracts something from.
SMOKE_FIXTURE=$(mktemp -d)
# Release what the line above acquired: the harness's EXIT trap calls this after
# removing the container, and the fixture failure path below calls it directly
# (the trap is armed only after this file is sourced).
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}
# mktemp creates the directory 0700 for the runner's user; the container runs as
# a different non-root uid, so the directory must be traversable and the file
# readable for that uid.
if ! printf 'FROM alpine:3.20\n' >"$SMOKE_FIXTURE/Dockerfile" \
  || ! chmod 755 "$SMOKE_FIXTURE" \
  || ! chmod 644 "$SMOKE_FIXTURE/Dockerfile"; then
  printf 'FAIL: could not write the smoke repository fixture\n' >&2
  smoke_cleanup
  exit 1
fi

# Word-split by the harness; a mktemp path contains no spaces. RUN_TIMEOUT
# bounds each `run` below, which otherwise waits on the daemon's 1h default.
SMOKE_RUN_ARGS="--network none -w /smoke-repo -v ${SMOKE_FIXTURE}:/smoke-repo:ro -e RUN_INTERVAL=off -e RUN_TIMEOUT=5m -e RENOVATE_PLATFORM=local -e RENOVATE_DRY_RUN=extract"

# Poll the container log for a fixed string. The json-file log driver can lag
# the writer, so a single grep can miss a line the container already wrote.
smoke_wait_for_log() {
  i=0
  while [ "$i" -lt 30 ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- "$1"; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$2" >&2
  return 1
}

smoke_verify() {
  if ! out=$(docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler run 2>&1); then
    printf 'FAIL: the offline extraction run against the fixture repository did not exit 0\n' >&2
    printf '%s\n' "$out" >&2
    return 1
  fi
  smoke_wait_for_log 'Repository finished' \
    "the run exited 0 but Renovate never logged 'Repository finished': the process did not reach the repository worker"
  # A directory with no visible package files is a soft skip (exit 0 and
  # 'Repository finished' still logged); this line only follows an extraction.
  smoke_wait_for_log 'Extracted dependencies' \
    "the run exited 0 but Renovate never logged 'Extracted dependencies': it did not see the fixture Dockerfile"
  if ! docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler health; then
    printf 'FAIL: health did not pass after a completed run\n' >&2
    return 1
  fi

  # Negative control. Hiding the global worker module makes Renovate's
  # bootstrap import reject, the same shape as a base image shipping a broken
  # module graph.
  if ! docker exec -u root "$SMOKE_CONTAINER" \
    mv /usr/local/renovate/dist/workers/global /tmp/smoke-hidden-workers-global; then
    printf 'FAIL: could not hide /usr/local/renovate/dist/workers/global; the control premise moved and the path needs re-pointing\n' >&2
    return 1
  fi
  if docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler run >/dev/null 2>&1; then
    printf 'FAIL: a crashed Renovate was reported as a completed run\n' >&2
    return 1
  fi
  smoke_wait_for_log 'renovate run failed' \
    "the crashed run exited non-zero but the scheduler never logged 'renovate run failed'"
  # Single shot, not polled: the wait above proved the log is flushed past run
  # 2's end, so a second 'Repository finished' would mean run 2 reached its
  # repository and failed for some other reason than the hidden module.
  if [ "$(docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF 'Repository finished')" != 1 ]; then
    printf 'FAIL: the crashed run reached the repository worker; it did not die at bootstrap\n' >&2
    return 1
  fi
  if docker exec "$SMOKE_CONTAINER" docker-renovate-scheduler health >/dev/null 2>&1; then
    printf 'FAIL: health still passes after a crashed run\n' >&2
    return 1
  fi

  # Every assertion above is silent on success, so name what was proved: a run
  # that drove Renovate and one whose hook returned early otherwise print the
  # same thing, leaving the harness's elapsed time unaccountable.
  printf 'renovate-scheduler payload: an offline run extracted the fixture Dockerfile and finished the repository with health passing, and with the global worker module hidden the run died at bootstrap without reaching the repository, was reported failed, and flipped health\n'
}
