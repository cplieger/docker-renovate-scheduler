# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs in external-trigger mode (RUN_INTERVAL=off):
# the daemon marks the health marker healthy on boot (idle, nothing failed),
# binds its trigger socket, and idles, so no RENOVATE_TOKEN, repositories, or
# network are needed to reach "healthy". Waits for the container HEALTHCHECK
# to report healthy - proving the scheduler binary runs on the
# renovate/renovate base, the inherited base ENTRYPOINT sets up the
# environment and launches the daemon, RENOVATE_BASE_DIR is writable, and the
# file-marker probe works.
SMOKE_APP_NAME=renovate-scheduler
# The smoke run sets RUN_INTERVAL=off, so the daemon marks the marker healthy
# on boot and the first probe succeeds inside the baked start period; 150s is
# margin for the image to boot and reach that first probe.
SMOKE_TIMEOUT=150
SMOKE_RUN_ARGS="-e RUN_INTERVAL=off"
