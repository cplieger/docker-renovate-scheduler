# Trivy reads trivy-secret.yaml from its working directory by default
# (--secret-config). The entry cannot live in .trivyignore: the shared CI scan
# overwrites that file, and an ID there would silence every private-key match.
allow-rules:
  # False positive: a test fixture key in the Go standard library source that
  # `install-tool golang` puts in the image, not a credential.
  - id: go-stdlib-x509-test-key
    description: Go standard library crypto/x509 test fixture
    path: (^|/)opt/containerbase/tools/golang/[^/]+/src/crypto/x509/platform_root_key\.pem$
